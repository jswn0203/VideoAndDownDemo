# GitHub 版：CI 流水线（单测 + 测试 Agent + 双模式合并闸门）
# 模式切换：仓库/环境变量 PIPELINE_MODE = auto | hitl（缺省 hitl）
# 风险分流：PR 带 risk:high 标签时，即使 auto 也跳过自动批准（强制人审，靠分支保护兜底）
name: CI

on:
  pull_request:
  workflow_dispatch: {}

env:
  PIPELINE_MODE: ${{ vars.PIPELINE_MODE || 'hitl' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # 按项目调整
          cache: gradle
      - name: 跑单测（失败也产出报告）
        run: |
          chmod +x gradlew          # Linux runner 上 git 不带执行位时 gradlew 会 Permission denied
          ./gradlew --no-daemon testDebugUnitTest || true
      - name: 保证产物必然存在（无报告时放占位文件）
        if: always()
        run: |
          if ! find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null | grep -q .; then
            # 注意目录名不能以点开头：upload-artifact@v4 默认忽略隐藏目录
            mkdir -p test-results-placeholder
            echo "unit-tests 未产出任何 JUnit 报告（可能编译失败或工程无单测）" > test-results-placeholder/no-results.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/
            test-results-placeholder/
          retention-days: 7

  test-agent:
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew || true
      - name: 汇总测试结果并回传 PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: bash scripts/test-agent-github.sh

  # ---- 双模式闸门 ----
  # auto 模式 + 非 risk:high：机器人自动批准（分支保护仍要求 1 个批准，此 bot 即是）
  auto-approve:
    runs-on: ubuntu-latest
    needs: test-agent
    if: >-
      github.event_name == 'pull_request' &&
      vars.PIPELINE_MODE == 'auto' &&
      !contains(github.event.pull_request.labels.*.name, 'risk:high')
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ github.token }}

  # hitl 提示牌（方案②·免费降级）：hitl 模式或 risk:high 时打印人工审查提醒
  # 真正的人工闸门 = 分支保护的 Required approvals（人 Review approve 后才能合并）
  # 未来升级 GitHub Pro/Team 后，可在本 job 加回 environment: manual-gate
  # （配合 Settings → Environments 的 Required reviewers）恢复"两次点击"完整闸门
  manual-gate:
    runs-on: ubuntu-latest
    needs: test-agent
    if: >-
      github.event_name == 'pull_request' &&
      (vars.PIPELINE_MODE != 'auto' ||
       contains(github.event.pull_request.labels.*.name, 'risk:high'))
    steps:
      - run: >-
          echo "⚠️ hitl/高风险 PR：请人工 Review 本 PR 后批准合并。
          auto 模式（非 risk:high）下本 job 不会运行，由机器人自动批准。"
