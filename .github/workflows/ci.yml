# GitHub 版：CI 流水线（单测 + 测试 Agent + 双模式合并闸门）
# 模式切换：仓库/环境变量 PIPELINE_MODE = auto | hitl（缺省 hitl）
# 风险分流：PR 带 risk:high 标签时，即使 auto 也跳过自动批准（强制人审，靠分支保护兜底）
name: CI

on:
  pull_request:
  workflow_dispatch: {}

env:
  PIPELINE_MODE: ${{ vars.PIPELINE_MODE || 'hitl' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # 按项目调整
          cache: gradle
      - run: ./gradlew --no-daemon lintDebug testDebugUnitTest || true   # 失败也产出报告
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/
          retention-days: 7

  test-agent:
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 汇总测试结果并回传 PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: bash scripts/test-agent-github.sh

  # ---- 双模式闸门 ----
  # auto 模式 + 非 risk:high：机器人自动批准（分支保护仍要求 1 个批准，此 bot 即是）
  auto-approve:
    runs-on: ubuntu-latest
    needs: test-agent
    if: >-
      github.event_name == 'pull_request' &&
      vars.PIPELINE_MODE == 'auto' &&
      !contains(github.event.pull_request.labels.*.name, 'risk:high')
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ github.token }}

  # hitl 闸门：hitl 模式或 risk:high 时，要求人工批准后才能过这一关
  # （配合分支保护把本 job 设为 required check：人不点运行就永远红着）
  manual-gate:
    runs-on: ubuntu-latest
    needs: test-agent
    if: >-
      github.event_name == 'pull_request' &&
      (vars.PIPELINE_MODE != 'auto' ||
       contains(github.event.pull_request.labels.*.name, 'risk:high'))
    steps:
      - run: >
          echo "人工闸门：请在 PR 页 Review approve 后，手动点击本 job 的 Re-run 放行。"
