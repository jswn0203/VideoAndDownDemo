# GitHub 版：官方 Claude Code Action
# 触发：issue/PR 中评论 @claude，或 issue 打上 status:confirmed 标签
# 对应 GitLab 方案的 webhook 监听服务 + coding-agent job，这里一个 workflow 全覆盖
name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # claude-code-action 的鉴权探测需要，缺失会报 OIDC 错误

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false   # 排队执行，避免多指令并行冲突

jobs:
  claude:
    runs-on: ubuntu-latest
    if: |-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.label.name == 'status:confirmed')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'     # 按项目 AGP 要求调整

      - uses: anthropics/claude-code-action@v1
        env:
          # ---- 模型接入：火山方舟 Agent Plan（Anthropic 兼容端点）----
          # Secret：ARK_AUTH_TOKEN（ark- 开头的 Plan Key）
          # Variable：ARK_MODEL（如 GLM，具体 ID 以 `arkcli resources list` 为准）、可选 ARK_BASE_URL
          ANTHROPIC_BASE_URL: ${{ vars.ARK_BASE_URL || 'https://ark.cn-beijing.volces.com/api/plan' }}
          # 注意：action 内部靠 ANTHROPIC_API_KEY 判断"是否已配置鉴权"，
          # 只设 AUTH_TOKEN 它会误判为未配置而走 OIDC 报错。两个都设，值相同。
          ANTHROPIC_API_KEY: ${{ secrets.ARK_AUTH_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ARK_AUTH_TOKEN }}
          ANTHROPIC_MODEL: ${{ vars.ARK_MODEL || 'glm-4.6' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ARK_MODEL || 'glm-4.6' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ARK_MODEL || 'glm-4.6' }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ARK_MODEL || 'glm-4.6' }}
          API_TIMEOUT_MS: '3000000'
        with:
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Bash Read Edit Write"
          # 让 Agent 遵守 label 状态机与 PR 脚本约定（CLAUDE.md 亦会被自动读取）
          prompt: |
            你是本仓库的编码 Agent，遵守仓库内 CLAUDE.md 与 .claude/agents/ 的分工规则。
            若由 issue 的 status:confirmed 标签触发：读取 issue 全部评论与验收标准，
            按主线调度 subagent 完成实现，开分支提交，创建 PR 并在描述中写 "Closes #<issue编号>"，
            给 issue 打 status:testing 标签。
            若由 @claude 评论触发：按评论指令读取上下文并执行；涉及代码改动时更新现有 PR 分支。
